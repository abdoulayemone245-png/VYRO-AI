<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYRO AI - The Future of Creativity</title>
<style>
* {box-sizing:border-box}
body {
 margin:0;
 font-family:Arial,sans-serif;
 background:#080b18;
 color:white;
 text-align:center;
}
header {
 padding:25px 15px;
 background:#111831;
 border-bottom:1px solid #29375c;
}
.logo {
 font-size:35px;
 font-weight:bold;
 color:#54d8ff;
 letter-spacing:4px;
}
header p {color:#aab8d6}
main {padding:45px 20px}
h1 {font-size:32px}
h1 span {color:#54d8ff}
.intro {color:#b9c5df;line-height:1.7}
.panel {
 max-width:600px;
 margin:30px auto;
 padding:22px;
 background:#111831;
 border:1px solid #29375c;
 border-radius:18px;
}
textarea {
 width:100%;
 height:130px;
 padding:15px;
 border-radius:10px;
 border:1px solid #53658e;
 background:#080b18;
 color:white;
 font-size:16px;
}
button {
 margin-top:15px;
 padding:14px 25px;
 border:0;
 border-radius:10px;
 background:#54d8ff;
 color:#080b18;
 font-size:16px;
 font-weight:bold;
}
footer {padding:25px;color:#8190ad}
</style>
</head>
<body>
<header>
 <div class="logo">VYRO AI</div>
 <p>The Future of Creativity</p>
</header>
<main>
 <h1>Bienvenue sur <span>VYRO AI</span></h1>
 <p class="intro">
 Votre univers d'intelligence artificielle.<br>
 Imaginez, créez et innovez avec VYRO AI.
 </p>
 <div class="panel">
  <h2>Votre espace créatif</h2>
  <textarea placeholder="Écrivez votre idée ici..."></textarea>
  <br>
  <button onclick="alert('Bienvenue dans VYRO AI !')">
   Commencer
  </button>
 </div>
</main>
<footer>© 2026 VYRO AI — Tous droits réservés</footer>
</body>
</html>
